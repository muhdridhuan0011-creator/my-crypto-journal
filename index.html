<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>CryptoSim — Compound Simulator & Journal</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=JetBrains+Mono:wght@400;600;700&display=swap');
:root{
  --bg:#0a0c10;--surf:#111318;--surf2:#181c24;--border:#1f2430;
  --accent:#00e5ff;--green:#00e676;--red:#ff1744;--gold:#ffd600;
  --text:#e2e8f0;--dim:#8892a4;
  --glow: rgba(0, 229, 255, 0.15);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--text);font-family:'Space Grotesk',sans-serif;min-height:100vh}


/* ── HEADER ── */
.hdr{background:linear-gradient(135deg,#0d1117,#111827);border-bottom:1px solid var(--border);padding:20px 28px 16px;display:flex;align-items:center;gap:14px;position:relative;overflow:hidden}
.hdr::before{content:'';position:absolute;top:-60px;right:-60px;width:200px;height:200px;background:radial-gradient(circle,rgba(0,229,255,0.07) 0%,transparent 70%);border-radius:50%}
.hdr-ico{width:44px;height:44px;border-radius:12px;background:rgba(0,229,255,0.1);border:1px solid rgba(0,229,255,0.2);display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.hdr h1{font-size:20px;font-weight:700;letter-spacing:-0.5px}.hdr h1 span{color:var(--accent)}
.hdr p{font-size:11px;color:var(--dim);font-family:'JetBrains Mono',monospace;margin-top:2px}
.dot{display:inline-block;width:5px;height:5px;background:var(--green);border-radius:50%;margin-right:5px;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.2}}

/* ── TABS ── */
.tabs{display:grid;grid-template-columns:1fr 1fr;background:var(--surf);border-bottom:2px solid var(--border)}
.tab{padding:13px;text-align:center;font-size:12px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--dim);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-2px;transition:all 0.2s;user-select:none}
.tab.active{color:var(--accent);border-bottom-color:var(--accent)}
.tab:hover{color:var(--text);background:rgba(255,255,255,0.02)}

/* ── PAGES ── */
.page{display:none;padding-bottom:60px}.page.active{display:block}

/* ── SECTIONS ── */
.sec{background:var(--surf);border-bottom:1px solid var(--border);padding:18px 24px}
.sec-title{font-size:10px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--dim);margin-bottom:14px}


/* ── GRIDS ── */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-bottom:12px}
.grid6{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:12px}


/* ── INPUT GROUPS ── */
.inp-g{display:flex;flex-direction:column;gap:5px}
.inp-lbl{font-size:9px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:var(--dim)}
.inp-w{position:relative}
.inp-pre{position:absolute;left:11px;top:50%;transform:translateY(-50%);font-size:13px;pointer-events:none;z-index:1;color:var(--dim)}
.inp-suf{position:absolute;right:11px;top:50%;transform:translateY(-50%);font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:700;color:var(--dim);pointer-events:none}
.ni{width:100%;background:var(--surf2);border:1.5px solid var(--border);border-radius:8px;color:var(--text);font-family:'JetBrains Mono',monospace;font-size:16px;font-weight:700;padding:11px 40px 11px 32px;outline:none;-moz-appearance:textfield;transition:border-color 0.2s,box-shadow 0.2s}
.ni::-webkit-outer-spin-button,.ni::-webkit-inner-spin-button{-webkit-appearance:none}
.ni:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(0,229,255,0.08)}
.ti{width:100%;background:var(--surf2);border:1.5px solid var(--border);border-radius:8px;color:var(--text);font-family:'JetBrains Mono',monospace;font-size:14px;font-weight:600;padding:11px 13px;outline:none;transition:border-color 0.2s}
.ti:focus{border-color:var(--accent)}
.inp-hint{font-size:9px;color:var(--dim);font-family:'JetBrains Mono',monospace}


/* ── OUTCOME TOGGLE ── */
.outcome-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.ob{padding:13px;border-radius:9px;border:2px solid var(--border);background:var(--surf2);color:var(--dim);font-family:'JetBrains Mono',monospace;font-size:14px;font-weight:700;cursor:pointer;transition:all 0.15s;text-align:center;letter-spacing:1px}
.ob:hover{border-color:var(--dim)}
.ob.win-sel{background:rgba(0,230,118,0.15);border-color:var(--green);color:var(--green);box-shadow: 0 0 10px rgba(0,230,118,0.1)}
.ob.loss-sel{background:rgba(255,23,68,0.15);border-color:var(--red);color:var(--red);box-shadow: 0 0 10px rgba(255,23,68,0.1)}

/* ── BUTTONS ── */
.btn{font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:700;padding:7px 13px;border-radius:7px;border:none;cursor:pointer;transition:all 0.12s;letter-spacing:0.5px}
.btn:hover{filter:brightness(1.2)}
.btn:active{transform:scale(0.95)}
.btn-outline{background:transparent;border:1px solid var(--border);color:var(--dim)}
.btn-outline:hover{border-color:var(--accent);color:var(--accent)}
.btn-green{background:rgba(0,230,118,0.12);border:1px solid rgba(0,230,118,0.25);color:var(--green)}
.btn-red{background:rgba(255,23,68,0.12);border:1px solid rgba(255,23,68,0.25);color:var(--red)}
.btn-accent{background:rgba(0,229,255,0.12);border:1px solid rgba(0,229,255,0.25);color:var(--accent)}
.btn-add{width:100%;background:linear-gradient(135deg,#00e676,#00a854);color:#000;font-family:'Space Grotesk',sans-serif;font-size:14px;font-weight:700;padding:14px;border-radius:10px;border:none;cursor:pointer;box-shadow:0 0 20px rgba(0,230,118,0.18);transition:all 0.15s;margin-top:4px}
.btn-add:hover{transform:translateY(-1px);box-shadow:0 0 28px rgba(0,230,118,0.28)}
.btn-run{width:100%;background:linear-gradient(135deg,#00e5ff,#0088cc);color:#000;font-family:'Space Grotesk',sans-serif;font-size:14px;font-weight:700;padding:14px;border-radius:10px;border:none;cursor:pointer;box-shadow:0 0 20px rgba(0,229,255,0.18);transition:all 0.15s}
.btn-run:hover{transform:translateY(-1px);box-shadow:0 0 28px rgba(0,229,255,0.28)}


/* ── EV BAR ── */
.ev-row{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--border);border-radius:9px;overflow:hidden;margin-bottom:14px}
.ev-cell{background:var(--surf2);padding:9px 6px;text-align:center}
.ev-key{font-size:8px;letter-spacing:1px;text-transform:uppercase;color:var(--dim);margin-bottom:3px}
.ev-val{font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:700}


/* ── SEQUENCE ── */
.seq-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:9px;flex-wrap:wrap;gap:8px}
.seq-lbl{font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--dim)}
.seq-btns{display:flex;gap:6px;flex-wrap:wrap}
.seq-grid{display:flex;flex-wrap:wrap;gap:3px;max-height:108px;overflow-y:auto;padding:6px;background:var(--surf2);border:1px solid var(--border);border-radius:7px;margin-bottom:8px}
.sq{width:28px;height:28px;border-radius:4px;font-family:'JetBrains Mono',monospace;font-size:8px;font-weight:700;border:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;flex-shrink:0;line-height:1;transition:transform 0.1s,filter 0.1s}
.sq.WIN{background:rgba(0,230,118,0.18);color:var(--green);border:1px solid rgba(0,230,118,0.3)}
.sq.LOSS{background:rgba(255,23,68,0.18);color:var(--red);border:1px solid rgba(255,23,68,0.3)}
.sq:hover{transform:scale(1.1);filter:brightness(1.3)}
.sq-n{font-size:6px;opacity:0.4}
.seq-info{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--dim);text-align:center;margin-top:4px}

/* ── BALANCE HERO ── */
.bal-hero{background:var(--surf2);border-bottom:1px solid var(--border);padding:16px 24px;display:flex;align-items:center;justify-content:space-between}
.bal-label{font-size:9px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--dim);margin-bottom:4px}
.bal-val{font-family:'JetBrains Mono',monospace;font-size:26px;font-weight:700;color:var(--accent)}
.bal-sub{font-size:11px;color:var(--dim);font-family:'JetBrains Mono',monospace;margin-top:2px}
.bal-ret{font-family:'JetBrains Mono',monospace;font-size:18px;font-weight:700;text-align:right}

/* ── STATS GRID ── */
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--border);border-bottom:1px solid var(--border)}
.stat-card{background:var(--surf);padding:14px 18px}
.stat-lbl{font-size:9px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--dim);margin-bottom:4px}
.stat-val{font-family:'JetBrains Mono',monospace;font-size:20px;font-weight:700;line-height:1}
.stat-sub{font-size:10px;color:var(--dim);margin-top:3px;font-family:'JetBrains Mono',monospace}
.green{color:var(--green)}.red{color:var(--red)}.gold{color:var(--gold)}.blue{color:var(--accent)}


/* ── CHART ── */
.chart-sec{padding:20px 24px 0}
.chart-title{font-size:10px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--dim);margin-bottom:10px}
.chart-wrap{background:var(--surf);border:1px solid var(--border);border-radius:9px;padding:14px;position:relative;overflow:visible;}
svg.chart{width:100%;display:block;cursor:crosshair;}


/* ── CHART TOOLTIP (HUD) ── */
.chart-tooltip {
  position: absolute;
  pointer-events: none;
  background: rgba(17, 19, 24, 0.95);
  border: 1.5px solid var(--accent);
  border-radius: 8px;
  padding: 10px 14px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  color: var(--text);
  box-shadow: 0 8px 24px rgba(0,0,0,0.6), 0 0 12px rgba(0, 229, 255, 0.15);
  display: none;
  z-index: 10;
  transform: translate(-50%, -125%);
  white-space: nowrap;
  transition: opacity 0.1s ease, transform 0.1s ease;
}

/* Custom cyber highlights for bar charts */
.bar-group:hover rect {
  opacity: 1;
  filter: drop-shadow(0px 0px 4px var(--accent));
}

/* ── MONTHLY HEATMAP GRID (KOTAK KECIL) ── */
.monthly-grid {
  display: grid;
  grid-template-columns: repeat(12, minmax(40px, 54px));
  gap: 6px;
  justify-content: center;
  margin: 0 auto;
}
@media (max-width: 768px) {
  .monthly-grid {
    grid-template-columns: repeat(6, minmax(40px, 54px));
  }
}
@media (max-width: 480px) {
  .monthly-grid {
    grid-template-columns: repeat(4, minmax(36px, 46px));
    gap: 4px;
  }
}
.month-box {
  background: var(--surf2);
  border: 1px solid var(--border);
  border-radius: 6px;
  aspect-ratio: 1/1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: all 0.2s ease;
  position: relative;
  user-select: none;
}
.month-box:hover {
  border-color: var(--accent) !important;
  transform: translateY(-2px);
  box-shadow: 0 4px 12px rgba(0, 229, 255, 0.2) !important;
}
.month-box .m-lbl {
  font-size: 8px;
  font-weight: 700;
  letter-spacing: 0.5px;
  color: var(--dim);
  margin-bottom: 2px;
}
.month-box.active-win .m-lbl, .month-box.active-loss .m-lbl {
  color: var(--text);
}
.month-box .m-val {
  font-family: 'JetBrains Mono', monospace;
  font-size: 9px;
  font-weight: 700;
  line-height: 1;
}
